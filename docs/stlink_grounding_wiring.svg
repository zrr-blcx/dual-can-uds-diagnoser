<text text-anchor="middle" x="1353.57" y="-407.94" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">要点：</text>
<text text-anchor="middle" x="1353.57" y="-392.94" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">1. ST&#45;Link 的 GND 必须接：不共地 SWD 通信不了</text>
<text text-anchor="middle" x="1353.57" y="-377.94" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">2. 3.3V 可不接：板子自己供电即可（接了也没关系）</text>
<text text-anchor="middle" x="1353.57" y="-362.94" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">3. GND 路径 = ST&#45;Link GND → 板 GND → SN65HVD230 GND → 面包板蓝轨（全部连通）</text>
<text text-anchor="middle" x="1353.57" y="-347.94" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">4. 同一侧蓝轨任意孔即可，别跨上下排（中间可能断口）</text>
<text text-anchor="middle" x="1353.57" y="-332.94" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">5. 无论接 F407 还是 F103，GND 都汇入同一个公共 GND 网络</text>
