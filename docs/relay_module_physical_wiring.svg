<!-- note -->
<g id="node10" class="node">
<title>note</title>
<polygon fill="#fff8dc" stroke="#b8860b" points="1929.62,-527.85 1392.38,-527.85 1392.38,-429.85 1935.62,-429.85 1935.62,-521.85 1929.62,-527.85"/>
<polyline fill="none" stroke="#b8860b" points="1929.62,-527.85 1929.62,-521.85"/>
<polyline fill="none" stroke="#b8860b" points="1935.62,-521.85 1929.62,-521.85"/>
<text text-anchor="middle" x="1664" y="-513.4" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">要点：</text>
<text text-anchor="middle" x="1664" y="-498.4" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">1. 先断电用万用表确认上排端子 NC/COM/NO：默认蜂鸣的一对 = COM+NC</text>
<text text-anchor="middle" x="1664" y="-483.4" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">2. CH1 常闭串 CANH，用于模拟通信丢失；CH2 常开跨 CANH&#45;CANL，用于 Bus&#45;Off</text>
<text text-anchor="middle" x="1664" y="-468.4" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">3. 5V 只供线圈，不碰收发器；3.3V 世界不受影响</text>
<text text-anchor="middle" x="1664" y="-453.4" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">4. 低电平触发：按钮按下 IN 接 GND → 吸合；松开 → 释放</text>
<text text-anchor="middle" x="1664" y="-438.4" font-family="Microsoft YaHei" font-size="11.00" fill="#1a1b1c">5. r11 约 2 秒观察到 3 次自动恢复；W2&#45;10 约 8 秒验证复位分支。只在受控台架执行，达到判据立即松开</text>
