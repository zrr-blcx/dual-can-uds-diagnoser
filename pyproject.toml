[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-can-uds-diagnoser"
version = "0.6.0"
description = "Dual-node CAN + UDS diagnostic toolchain for STM32F407/F103 validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zrr-blcx" }]
requires-python = ">=3.10"
dependencies = [
    "python-can[serial]>=4.3.0",
    "pyusb>=1.2.1",
    "gs_usb>=0.3.1",
    "libusb>=1.0.26",
    "udsoncan>=1.20.0",
    "cantools>=39.4.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Embedded Systems",
]

[project.urls]
Repository = "https://github.com/zrr-blcx/dual-can-uds-diagnoser"
Issues = "https://github.com/zrr-blcx/dual-can-uds-diagnoser/issues"

[project.scripts]
dual-can-uds = "diagnoser.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["diagnoser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
