name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -vv 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR|E[[:space:]]|.*(Error|Exception):)' pytest.log \
              | tail -n 10 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  echo "::error title=Pytest failure::$line"
                done
          fi
          exit "$status"
      - name: Publish test failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Pytest failure tail"
            echo '```text'
            if [ -f pytest.log ]; then
              tail -n 200 pytest.log
            else
              echo "pytest did not start; inspect the preceding CI steps."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
