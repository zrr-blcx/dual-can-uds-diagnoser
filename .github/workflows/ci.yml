name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -vv 2>&1 | tee pytest.log
      - name: Publish test failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Pytest failure tail"
            echo '```text'
            if [ -f pytest.log ]; then
              tail -n 200 pytest.log
            else
              echo "pytest did not start; inspect the preceding CI steps."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
